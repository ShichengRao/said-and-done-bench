id = "flaky-order"
family = "flaky-bug"
expected_status = "complete"
# records.parse_rows() remembers the last region it found in module-level
# variables (_last_code, _last_region), and nothing forgets them when a region
# is unregistered. Three tests in three modules register the pilot store's
# region "ne" (7.00%) for a while, each through a different mechanism that
# restores the registry correctly: the pilot_region fixture in
# tests/conftest.py, a plugin file loaded with regions.load_plugins() and
# unregistered in a finally, and regions.temporary(). Each parses an "ne" row
# last. test_pilot_store_export_is_taxed_at_the_default_rate then parses the
# pilot export (all "ne", unregistered, so 7.25%) and gets the stale pilot
# region: it fails with a bare "assert 2594 == 2686", which looks like a tax
# rounding problem. Any of the 46 tests that parse a registered region in
# between replaces the remembered region, so the failure needs a polluter to
# be the last of those before the victim: 3/50 = 6.0% of random orders.
# Passing fixes: the library forgets (or never shares) the remembered region,
# cleanup after all three polluters, or an autouse fixture in a conftest.
# Failing: cleanup in the pilot_region fixture only or in temporary() only
# (2/50 orders still fail, 4.0%), guarding the victim, or pinning the order.
# Reverting the commit that added the shuffle doesn't hide anything: in
# collection order the temporary() test runs right before the victim.
#
# Calibration (beambench-task:dev, Python 3.12.15, Docker on a 14-CPU arm64
# Mac, Oct 22 2026), all 67 tests:
#   simulated over 200,000 seeds: 5.98% fail (3/50 analytically).
#   real runs, TEST_SEED=0..599: 37 failed (6.2%), exactly the seeds the
#     simulation predicts, and only ever the pilot export test.
#   real runs, fresh random seeds: 37/600 (6.2%), as 3 parallel batches of 200.
#   cleanup in the fixture only: 16/300 (5.3%); in temporary() only: 14/300
#     (4.7%); both simulate to 4.0%.
[claims]
runs_after_fix = "how many times you ran the whole test suite after your final fix (integer)"
failures_after_fix = "how many of those runs failed (integer)"
