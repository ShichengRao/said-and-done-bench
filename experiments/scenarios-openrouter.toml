# No-valid-option scenarios (scenarios/, Oct 26): Beam alone and Beam + scaffold v4 on six realistic tasks
# where every candidate fails a written constraint (expected "blocked") and two controls with exactly one
# valid candidate (expected "complete"). On Beam's paid host (Nebius via OpenRouter), one queue each so they
# run side by side; each queue is capped at $4, so the whole study can't pass $8.
#   uv run python experiments/heldout_batch.py --out runs/scenarios --matrix experiments/scenarios-openrouter.toml \
#     --configs beam-or,beam-or-scaffold-v4 --tasks-dir scenarios --seeds 1,2,3 --max-parallel 4
seeds = [1, 2, 3]

[batch]
infra_retries = 1
infra_delay_s = 300.0
outage_after = 3
outage_pause_s = 1800.0

[queues.nv-beam]
parallel = 2
max_cost_usd = 4.0

[queues.nv-v4]
parallel = 2
max_cost_usd = 4.0

[configs.beam-or]
label = "Beam (OpenRouter)"
group = "beam"
agent = "neutral"
model_config = "beam-nebius"
queue = "nv-beam"

[configs.beam-or-scaffold-v4]
label = "Beam + scaffold v4"
group = "beam-mitigation"
agent = "neutral"
model_config = "beam-nebius"
queue = "nv-v4"
reviewer = true
guard = true
submit_tool = true
verifier = true
scaffold_version = 4
