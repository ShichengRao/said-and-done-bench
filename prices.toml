# API list prices in USD per 1M tokens, for the cost report (beambench/costs.py).
#
# A run's cost is what its API billed when the run reports it (Claude Code on
# an API key, OpenRouter); otherwise its tokens at these prices, marked as an
# estimate. Checked Oct 22, 2026 against third-party pages citing the official
# price lists (Anthropic's and OpenAI's pages weren't reachable); confirm
# before publishing. Keys are the model ids runs record.

[models."claude-opus-5-5"]
input = 4.00
cached_input = 0.20  # Cache reads.
cache_write = 5.00  # 5-minute cache writes.
output = 20.00  # Includes thinking.

# Codex runs on the ChatGPT plan; this is what the same tokens cost on the API.
[models."gpt-6.1-sol"]
input = 2.00
cached_input = 0.10
output = 10.00

# Reflection's beta API is free; priced at the paid host the plan pinned for
# Beam (Nebius FP8 via OpenRouter) as its market rate.
[models."Beam-1.0-501B-A23B"]
input = 0.25
cached_input = 0.05
output = 1.00

[models."zai-org/GLM-5.2:deepinfra"]
input = 0.75
# The router lists no cached-input price, but about 95% of GLM's input is cached and Hugging Face's
# bill (Oct 25: $1.96 for its first 15 runs) matches cached input at about $0.10/M, not $0.75.
# Check against the final bill.
cached_input = 0.10
output = 2.40

[models."deepseek/deepseek-v4.1-flash"]
input = 0.14
cached_input = 0.004
output = 0.42

[models."nvidia/nemotron-3-ultra-550b-a55b"]  # Paid, DeepInfra FP4 (OpenRouter reports the billed cost).
